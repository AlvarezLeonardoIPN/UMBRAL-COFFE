<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Producto | UMBRAL</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>

        .product-container { max-width: 1000px; margin: 50px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 20px; }

        .product-image-side { display: flex; flex-direction: column; gap: 15px; }

        .main-image-container img { width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: cover; aspect-ratio: 1/1; }

        .product-info h1 { font-family: 'Playfair Display', serif; color: #c5a059; font-size: 2.5rem; margin: 0; }

        .category-tag { text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; color: #888; margin-bottom: 10px; display: block; }

        .price { font-size: 2.2rem; font-weight: bold; margin: 15px 0; color: #fff; }

        .delivery-tag { color: #c5a059; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 0.9rem; }

        .qty-selector input { width: 60px; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; text-align: center; }

        .btn-add { background: #c5a059; color: #000; border: none; padding: 18px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; text-transform: uppercase; transition: 0.3s; }

        .reviews-section { max-width: 1000px; margin: 40px auto; padding: 20px; border-top: 1px solid #222; }

        .review-card { background: #161616; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }

        .review-form { background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #c5a05933; }

        .review-form select, .review-form textarea { width: 100%; background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; margin: 10px 0; }

    </style>

</head>

<body style="background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif;">

    <div class="product-container">

        <div class="product-image-side">

            <div class="main-image-container">

                <img id="main-img-el" src="assets/img/placeholder.jpg" alt="Cargando...">

            </div>

        </div>

            <div class="qty-selector">

                <label>Cantidad:</label>

                <input type="number" id="prod-qty" value="1" min="1">

            </div>

            <button class="btn-add" id="btn-add-cart">AÃ±adir al carrito</button>

    </div>



    <div class="reviews-section">

        <div id="login-to-review" style="text-align: center; padding: 20px; border: 1px dashed #333; margin-top: 20px;">

            <p>Para dejar una reseÃ±a, <a href="login.html" style="color: #c5a059;">inicia sesiÃ³n</a>.</p>

        </div>

    </div>



    <script src="assets/js/producto.js"></script>

</body>

</html>
