<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - UMBRAL</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: #0d0d0d; color: #fff; font-family: 'Inter', sans-serif; }
        .tabs { display: flex; gap: 20px; margin: 20px 0; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #666; padding: 10px 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .tab-btn.active { color: #c5a059; border-bottom: 2px solid #c5a059; }
        .admin-section { display: none; padding: 20px 0; }
        .admin-section.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: #161616; padding: 20px; border-radius: 12px; border: 1px solid #222; }
        .user-row { background: #1f1f1f; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box;}
        .btn-primario { background: #c5a059; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: #c5a059; text-align: left; padding: 10px; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #222; font-size: 13px; }
        /* Estilo para miniaturas de imágenes */
        .thumb-wrapper { position: relative; width: 70px; height: 70px; border: 1px solid #444; border-radius: 6px; overflow: hidden; background: #000; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .btn-del-img { position: absolute; top: 0; right: 0; background: rgba(255,0,0,0.8); color: white; border: none; font-size: 12px; cursor: pointer; padding: 2px 5px; border-bottom-left-radius: 6px; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1 id="panel-title" style="font-family: 'Playfair Display', serif; color: #c5a059;">UMBRAL ADMIN ⚜️</h1>
            <a href="tienda.html" style="color: #fff; text-decoration: none; opacity: 0.7;">← Volver</a>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('sec-productos')">Productos</button>
            <button class="tab-btn" id="tab-users" onclick="openTab('sec-usuarios')">Usuarios</button>
            <button class="tab-btn" id="tab-reports" onclick="openTab('sec-reportes')">Reportes</button>
        </div>

        <div id="sec-productos" class="admin-section active">
            <div class="card" style="margin-bottom: 30px; border: 1px solid #c5a059;">
                <h3 style="color: #c5a059;">📦 Pedidos del Día</h3>
                <div id="ventas-dia-list">Cargando pedidos...</div>
            </div>

            <div class="grid-2">
                <div class="card">
                    <h3>Inventario</h3>
                    <div id="products-list">Cargando productos...</div>
                </div>
                <div class="card">
                    <h3 id="form-title">Nuevo Producto</h3>
                    <form id="product-form">
                        <label>Nombre</label><input id="p-name" type="text" required>
                        <div style="display:flex; gap:10px;">
                            <div style="flex:1"><label>Precio</label><input id="p-price" type="number" step="0.01"></div>
                            <div style="flex:1"><label>Stock</label><input id="p-stock" type="number"></div>
                        </div>
                        <label>Entrega Estimada (Días)</label><input id="p-delivery" type="number" value="3">
                        <label>Categoría</label><select id="p-category"></select>
                        <label>Descripción</label><textarea id="p-desc" rows="3"></textarea>
                        
                        <label style="margin-top: 15px; display: block;">Imágenes Actuales</label>
                        <div id="current-images-container" style="display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; min-height: 40px;">
                            <small style="opacity: 0.5;">No hay imágenes o selecciona un producto.</small>
                        </div>

                        <label>Subir nuevas imágenes</label>
                        <input id="p-images" type="file" multiple accept="image/*">
                        
                        <button id="btn-save" class="btn-primario" type="button">Guardar Producto</button>
                        <button id="btn-delete" style="background:red; display:none;" class="btn-primario" type="button">Eliminar Producto</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="sec-usuarios" class="admin-section">
            <div class="card"><h3>Gestión de Usuarios</h3><div id="users-list"></div></div>
        </div>
        <div id="sec-reportes" class="admin-section">
            <div class="card"><h3>Ventas Diarias</h3><table><thead><tr><th>Día</th><th>Órdenes</th><th>Total</th></tr></thead><tbody id="report-daily-body"></tbody></table></div>
        </div>
    </div>

    <script src="assets/js/auth_ui.js"></script>
    <script src="assets/js/admin_productos.js"></script>
    <script>
        function openTab(id) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
