<!DOCTYPE html>

<html lang="es">

<head>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <meta charset="UTF-8" />

  <title>Login | UMBRAL</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>

    .container { max-width: 1100px; margin: 0 auto; padding: 0 18px; }

    .hero-login .hero-content { padding-top: 90px; padding-bottom: 40px; text-align: center; }

    .login-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; align-items: start; }

    @media (max-width: 900px) { .login-layout { grid-template-columns: 1fr; } }

    .login-form-wrapper { border-radius: 22px; background: rgba(10,10,10,0.70); border: 1px solid rgba(212,175,55,0.20); box-shadow: 0 26px 80px rgba(0,0,0,0.55); overflow: hidden; }

    .login-card-head { padding: 18px; border-bottom: 1px solid rgba(212,175,55,0.10); display: flex; justify-content: space-between; }

    .login-card-head .title { margin: 0; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(212,175,55,0.9); }

    .login-card-body { padding: 18px; }

    .login-form, .step { display: grid; gap: 14px; }

    .form-group { display: grid; gap: 8px; }

    .form-group label { font-size: 13px; color: rgba(255,255,255,0.70); }

    .login-form input, .step input, .step select { width: 100%; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.10); color: #f2f2f2; outline: none; }

    .step select option { background-color: #111; color: #fff; }

    .btn-primario { border: 0; border-radius: 999px; padding: 14px 18px; cursor: pointer; background: rgba(212,175,55,0.92); color: #111; font-weight: 700; text-transform: uppercase; }

    .mensaje-error { padding: 12px; border-radius: 14px; border: 1px solid rgba(255, 85, 85, 0.35); background: rgba(255, 85, 85, 0.08); color: #ffcccc; display: none; font-size: 13px; }

    .umbral-divider { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 14px 0; color: rgba(255,255,255,0.45); font-size: 12px; text-transform: uppercase; }

    .umbral-divider::before, .umbral-divider::after { content: ""; height: 1px; background: rgba(212,175,55,0.14); }

  </style>

</head>

<body>

  <header class="header">

    <div class="header-inner">

      <div class="logo"><span class="logo-mark">⚜</span><span class="logo-text">UMBRAL</span></div>

      <nav class="nav">

        <a href="index.html">Inicio</a>

        <a href="tienda.html">Tienda</a>

      </nav>

      <div class="header-actions">

        <a href="login.html" class="link-login" id="umbral-login-link">Login</a>

      </div>

    </div>

  </header>



  <main>

    <section class="hero hero-login">

      <div class="container hero-content"><h1>ACCESO</h1></div>

    </section>



    <section class="login-section">

      <div class="container login-layout">

        <div class="login-info">

          <h2>Bienvenido de vuelta</h2>

          <p>Usa tu cuenta de UMBRAL para acceder a tus pedidos y cursos.</p>

        </div>



        <div class="login-form-wrapper">

          <div class="login-card-head"><p class="title">MI CUENTA</p></div>

          <div class="login-card-body">

            

            <form id="login-form" class="login-form">

              <div class="form-group"><label>Correo</label><input type="email" id="email" required /></div>

              <div class="form-group"><label>Contraseña</label><input type="password" id="password" required /></div>

              <button type="submit" class="btn-primario">Iniciar Sesión</button>

              <p id="login-error" class="mensaje-error"></p>

            </form>



            <div class="umbral-divider">o</div>



            <div class="google-wrap">

              <div id="g_id_onload" data-client_id="459725717130-9p33qepue979tpon38bnb8j9h3rthatk.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>

              <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="sign_in_with" data-size="large" data-logo_alignment="left"></div>

            </div>



            <div style="margin-top:16px">

              <button type="button" id="btn-show-register" class="btn btn-outline" style="width:100%;">Crear cuenta nueva</button>

            </div>



            <div id="register-wizard" style="display:none; margin-top:20px; border-top:1px solid rgba(212,175,55,0.12); padding-top:20px;">

              

              <div class="step" id="step-1">

                <div class="form-group"><label>Nombre</label><input id="reg-name" type="text" /></div>

                <div class="form-group"><label>Correo</label><input id="reg-email" type="email" /></div>

                <div class="form-group"><label>Contraseña</label><input id="reg-password" type="password" /></div>

                <button type="button" id="btn-step1-next" class="btn-primario">Continuar</button>

              </div>



              <div class="step" id="step-2" style="display:none">

                <div class="form-group"><label>Calle</label><input id="addr-street" /></div>

                <div class="form-group"><label>Núm. Ext</label><input id="addr-ext" /></div>

                <div class="form-group"><label>Colonia</label><input id="addr-neigh" /></div>

                <div class="form-group"><label>CP</label><input id="addr-cp" /></div>

                <button type="button" id="btn-step2-next" class="btn-primario">Continuar</button>

              </div>



              <div class="step" id="step-3" style="display:none">

                <div class="form-group"><label>Titular</label><input id="card-holder" /></div>

                <div class="form-group"><label>Número Tarjeta</label><input id="card-number" maxlength="16" /></div>

                <div style="display:flex; gap:10px">

                  <select id="card-mm">

                    <option value="01">01</option><option value="02">02</option><option value="03">03</option>

                    <option value="04">04</option><option value="05">05</option><option value="06">06</option>

                    <option value="07">07</option><option value="08">08</option><option value="09">09</option>

                    <option value="10">10</option><option value="11">11</option><option value="12">12</option>

                  </select>

                  <select id="card-yy">

                    <option value="2026">2026</option><option value="2027">2027</option>

                    <option value="2028">2028</option><option value="2029">2029</option>

                    <option value="2030">2030</option>

                  </select>

                </div>

                <div class="form-group"><label>CVV</label><input id="card-cvv" type="password" maxlength="4" /></div>

                <button type="button" id="btn-finish-register" class="btn-primario">Finalizar Registro</button>

              </div>



              <p id="reg-error" class="mensaje-error" style="margin-top:10px"></p>

            </div>



          </div>

        </div>

      </div>

    </section>

  </main>



  <script src="assets/js/login.js"></script>

  <script src="assets/js/registerWizard.js"></script>

</body>

</html>
