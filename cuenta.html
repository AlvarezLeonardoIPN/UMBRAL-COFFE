<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mi cuenta | UMBRAL</title>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>

    .container { max-width: 1100px; margin: 0 auto; padding: 0 18px; }

    .umbral-card{ border-radius: 22px; background: rgba(10,10,10,0.70); border: 1px solid rgba(212,175,55,0.18); box-shadow: 0 26px 80px rgba(0,0,0,0.55); overflow: hidden; margin-top: 18px; }

    .umbral-card-head{ padding: 18px; border-bottom: 1px solid rgba(212,175,55,0.10); display:flex; align-items:center; justify-content:space-between; }

    .umbral-title{ margin:0; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(212,175,55,0.92); }

    .umbral-sub{ margin:0; font-size: 12px; color: rgba(255,255,255,0.55); }

    .umbral-card-body{ padding: 18px; }

    .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    @media (max-width: 900px){ .form-grid{ grid-template-columns: 1fr; } }

    .form-group{ display:grid; gap:8px; margin: 0; }

    .form-group label{ font-size: 13px; color: rgba(255,255,255,0.70); }

    .umbral-input, .umbral-select{ width:100%; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.10); color: #f2f2f2; outline: none; }

    .btn-primario{ border: 0; border-radius: 999px; padding: 14px 18px; cursor: pointer; background: rgba(212,175,55,0.92); color: #111; font-weight: 800; text-transform: uppercase; }

    .umbral-list-item{ border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.02); padding: 12px 14px; margin-top: 10px; display:flex; justify-content: space-between; align-items: center; }

  </style>

</head>

<body>

  <header class="header">

    <div class="header-inner">

      <div class="logo"><span class="logo-mark">⚜</span><span class="logo-text">UMBRAL</span></div>

      <nav class="nav">

        <a href="index.html">Inicio</a>

        <a href="tienda.html">Tienda</a>

        <a href="mis_pedidos.html">Mis pedidos</a>

      </nav>

      <div class="header-actions">

        <div class="umbral-account" id="umbral-account">

          <button type="button" class="umbral-account-btn" id="umbral-account-btn">

            Hola, <span id="umbral-account-name">Usuario</span> ▾

          </button>

          <div class="umbral-dropdown" id="umbral-dropdown" style="display:none;">

            <a href="mis_pedidos.html">Mis pedidos</a>

            <a href="cuenta.html">Mi cuenta</a>

            <button type="button" class="umbral-logout" id="umbral-logout">Cerrar sesión</button>

          </div>

        </div>

      </div>

    </div>

  </header>



  <main>

    <section class="hero hero-login">

      <div class="container hero-content"><p class="overline">CUENTA</p><h1>Mi cuenta</h1></div>

    </section>



    <div class="container">

      <div class="umbral-card">

        <div class="umbral-card-head"><div><p class="umbral-title">Perfil</p><p class="umbral-sub">Tus datos básicos.</p></div></div>

        <div class="umbral-card-body">

          <div class="form-grid">

            <div class="form-group"><label>Nombre</label><input id="acc-name" class="umbral-input" type="text" /></div>

            <div class="form-group"><label>Correo</label><input id="acc-email" class="umbral-input" type="email" /></div>

          </div>

          <button id="btn-save-profile" class="btn-primario" style="margin-top:15px;">Guardar cambios</button>

        </div>

      </div>



      <div class="umbral-card">

        <div class="umbral-card-head"><div><p class="umbral-title">Direcciones</p><p class="umbral-sub">Agrega tus puntos de entrega.</p></div></div>

        <div class="umbral-card-body">

          <div class="form-grid">

            <div class="form-group"><label>Calle</label><input id="addr-street" class="umbral-input" /></div>

            <div class="form-group"><label>Núm. Ext</label><input id="addr-ext" class="umbral-input" /></div>

            <div class="form-group"><label>Colonia</label><input id="addr-neigh" class="umbral-input" /></div>

            <div class="form-group"><label>CP</label><input id="addr-cp" class="umbral-input" /></div>

          </div>

          <button id="btn-add-address" class="btn-primario" style="margin-top:15px;">Agregar Dirección</button>

          <div id="addresses-list"></div> </div>

      </div>



      <div class="umbral-card" style="margin-bottom: 50px;">

        <div class="umbral-card-head"><div><p class="umbral-title">Métodos de Pago</p><p class="umbral-sub">Gestión de tarjetas.</p></div></div>

        <div class="umbral-card-body">

          <div class="form-grid">

            <div class="form-group" style="grid-column: 1/-1;"><label>Titular</label><input id="card-holder" class="umbral-input" /></div>

            <div class="form-group" style="grid-column: 1/-1;"><label>Número</label><input id="card-number" class="umbral-input" maxlength="16" /></div>

            <div class="form-group">

              <label>Vencimiento</label>

              <div style="display:flex; gap:10px;">

                <select id="card-mm" class="umbral-select"><option value="01">01</option><option value="12">12</option></select>

                <select id="card-yy" class="umbral-select"><option value="2026">2026</option></select>

              </div>

            </div>

            <div class="form-group">

              <label>CVV</label>

              <input id="card-cvv" class="umbral-input" type="password" maxlength="4" placeholder="123" />

            </div>

            <div class="form-group" style="grid-column: 1/-1;"><label>Marca</label><select id="card-brand" class="umbral-select"><option value="Visa">Visa</option><option value="Mastercard">Mastercard</option></select></div>

          </div>

          <button id="btn-add-card" class="btn-primario" style="margin-top:15px;">Agregar Tarjeta</button>

          <div id="cards-list"></div> </div>

      </div>

    </div>

  </main>



  <script src="assets/js/auth_ui.js"></script>

  <script src="assets/js/cuenta.js"></script>

</body>

</html>
