<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventarios | UMBRAL</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">⚜</span>
      <span class="logo-text">UMBRAL</span>
    </div>

    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="tienda.html">Tienda</a>
      <a href="mis_pedidos.html">Mis pedidos</a>
      <a href="inventarios.html">Inventarios</a>
    </nav>

    <div class="header-actions">
      <a href="tienda.html" class="btn btn-outline">Tienda en linea</a>

      <div class="umbral-account" id="umbral-account" style="display:none;">
        <button type="button" class="umbral-account-btn" id="umbral-account-btn">
          Hola, <span id="umbral-account-name">Usuario</span>
          <span class="umbral-caret">▾</span>
        </button>

        <div class="umbral-dropdown" id="umbral-dropdown" style="display:none;">
          <a href="mis_pedidos.html">Mis pedidos</a>
          <a href="cuenta.html">Mi cuenta</a>
          <a href="admin.html" id="link-admin-panel" style="display:none;">Admin</a>
          <div class="umbral-sep"></div>
          <button type="button" class="umbral-logout" id="umbral-logout">
            Cerrar sesion
          </button>
        </div>
      </div>

      <a href="login.html" class="link-login" id="umbral-login-link">Login</a>
    </div>
  </div>
</header>

<main>
  <section class="hero hero-login">
    <div class="container hero-content">
      <p class="overline">PANEL INTERNO</p>
      <h1>Gestión de Inventarios</h1>
      <p class="hero-subtitle">
        Control de despachos, estatus de pedidos y cancelaciones.
      </p>
    </div>
  </section>

  <section class="login-section">
    <div class="container">

      <p id="inv-error" class="mensaje-error" style="display:none; text-align:center;"></p>

      <div id="orders-box" style="margin-top:18px; max-width: 900px; margin-left: auto; margin-right: auto;">
        <p style="text-align:center; opacity:0.5;">Cargando sistema...</p>
      </div>

    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <p>&copy; 2026 UMBRAL. Sistema de Gestión Interna.</p>
  </div>
</footer>

<script src="assets/js/auth_ui.js"></script>
<script src="assets/js/guards.js"></script>
<script>
  // Blindaje: Solo entra si es 'inventarios' o 'admin'
  guardRequireLogin("inventarios.html");
  guardRequireRole(["inventarios","admin"], "index.html");
  
  // Mostrar link a admin si corresponde
  const u = JSON.parse(localStorage.getItem("user")||"{}");
  if(u.role === 'admin') {
      const link = document.getElementById("link-admin-panel");
      if(link) link.style.display = "block";
  }
</script>

<script src="assets/js/inventarios.js"></script>

</body>
</html>
