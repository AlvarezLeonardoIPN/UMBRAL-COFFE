<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos | UMBRAL</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #c5a059;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(197, 160, 89, 0.2);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #c5a059;
        }
        .error-msg {
            background: #441a1a;
            color: #ff8080;
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-regresar {
            display: inline-block;
            margin-bottom: 20px;
            color: #c5a059;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="tienda.html" class="btn-regresar">← Volver a la Tienda</a>

        <div class="header">
            <h1>MIS PEDIDOS</h1>
            <p style="opacity: 0.7;">Historial de tus compras en la arquitectura líquida.</p>
        </div>

        <div id="orders-error" class="error-msg"></div>

        <div id="orders-list">
            <p style="text-align: center; opacity: 0.5;">Cargando tus pedidos...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="assets/js/auth_ui.js"></script>

    <script src="assets/js/mis_pedidos.js"></script>

</body>
</html>
